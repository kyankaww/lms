<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk - PKBM & LPK</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="text-center mb-3">
            <span class="brand-mark mb-2" data-brand-mark>P</span>
            <p class="small text-muted mb-0" data-brand-name>PKBM &amp; LPK</p>
          </div>

          <h4 class="mb-1 text-center">Masuk</h4>
          <p class="text-muted text-center small mb-4">Langkah 3 dari 3</p>

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div
                class="alert alert-success small py-2 d-none"
                id="verifiedBadge"
              >
                Email <strong id="verifiedEmail"></strong> terverifikasi.
              </div>

              <div id="alertArea"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                  />
                  <div class="invalid-feedback">Email tidak valid.</div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                  />
                  <div class="invalid-feedback">Wajib diisi.</div>
                </div>

                <div class="d-flex justify-content-between mb-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="remember"
                    />
                    <label class="form-check-label small" for="remember"
                      >Ingat saya</label
                    >
                  </div>
                  <a href="mailto:admin@pkbm.test?subject=Bantuan%20Akun" class="small">Lupa password?</a>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  id="btnLogin"
                >
                  Masuk
                </button>
              </form>
            </div>
          </div>

          <p class="text-center small mt-3">
            Belum punya akun? <a href="registration.html">Daftar</a>
            <span class="text-muted mx-1">·</span>
            <a href="admin/login.html">Masuk Admin</a>
          </p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/branding.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
